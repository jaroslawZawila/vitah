<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ViTAH · Ajustes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141413;font-family:'Geist',system-ui,sans-serif;color:#e8e7e2}
a{color:#8a9b62;text-decoration:none}a:hover{color:#a3b37a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #1e1e1e; padding: 56px 24px 110px; display: flex; flex-direction: column; gap: 26px; font-family: 'Geist', system-ui, sans-serif; color: #e8e7e2; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: 16px;">
    <div style="width: 64px; height: 64px; border-radius: 50%; border: 1px solid #3c3c37; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 300;">E</div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 300;">Elena Martín</h1>
      <div style="font-size: 14px; color: #9a9a94;">cliente@vitah.es</div>
    </div>
  </header>

  <section style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: #9a9a94;">IDIOMA</h2>
    <div role="group" aria-label="Idioma" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; background: #262624; border: 1px solid #34342f; border-radius: 10px;">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
        <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="min-height: 44px; border: none; border-radius: 7px; background: #e8e7e2; color: #1e1e1e; font-size: 15px; cursor: pointer;">{{l.label}}</button>
        </sc-if>
        <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="min-height: 44px; border: none; border-radius: 7px; background: transparent; color: #e8e7e2; font-size: 15px; cursor: pointer;">{{l.label}}</button>
        </sc-if>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column;">
    <h2 style="margin: 0 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: #9a9a94;">CUENTA Y SEGURIDAD</h2>
    <a href="A-Password.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 14px; font-size: 15px; color: #e8e7e2; border-bottom: 1px solid #2e2e2b;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9a94" stroke-width="1.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span style="flex-grow: 1;">Cambiar contraseña</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9a94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
    <div style="min-height: 56px; display: flex; align-items: center; gap: 14px; font-size: 15px; border-bottom: 1px solid #2e2e2b;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9a94" stroke-width="1.4" stroke-linecap="round"><path d="M8 4H6a2 2 0 0 0-2 2v2M16 4h2a2 2 0 0 1 2 2v2M8 20H6a2 2 0 0 1-2-2v-2M16 20h2a2 2 0 0 0 2-2v-2M9 10v1M15 10v1M10 15c1.2.8 2.8.8 4 0"></path></svg><span style="flex-grow: 1;">Acceso con Face ID</span>
      <sc-if value="{{faceOn}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="Face ID" aria-pressed="true" onClick="{{toggleFace}}" style="width: 52px; height: 32px; border-radius: 999px; border: none; background: #6b7a4a; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer;"><span style="width: 26px; height: 26px; border-radius: 50%; background: #f5f4f0;"></span></button></sc-if>
      <sc-if value="{{faceOff}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="Face ID" aria-pressed="false" onClick="{{toggleFace}}" style="width: 52px; height: 32px; border-radius: 999px; border: none; background: #3c3c37; padding: 3px; display: flex; justify-content: flex-start; cursor: pointer;"><span style="width: 26px; height: 26px; border-radius: 50%; background: #9a9a94;"></span></button></sc-if>
    </div>
  </section>

  <section style="display: flex; flex-direction: column;">
    <h2 style="margin: 0 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: #9a9a94;">NOTIFICACIONES</h2>
    <sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
      <div style="min-height: 60px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #2e2e2b;">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">{{n.label}}</span><span style="font-size: 13px; color: #9a9a94;">{{n.hint}}</span></span>
        <sc-if value="{{n.on}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{n.label}}" aria-pressed="true" onClick="{{n.toggle}}" style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 999px; border: none; background: #6b7a4a; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer;"><span style="width: 26px; height: 26px; border-radius: 50%; background: #f5f4f0;"></span></button></sc-if>
        <sc-if value="{{n.off}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="{{n.label}}" aria-pressed="false" onClick="{{n.toggle}}" style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 999px; border: none; background: #3c3c37; padding: 3px; display: flex; justify-content: flex-start; cursor: pointer;"><span style="width: 26px; height: 26px; border-radius: 50%; background: #9a9a94;"></span></button></sc-if>
      </div>
    </sc-for>
  </section>

  <section style="display: flex; flex-direction: column;">
    <a href="#" style="min-height: 52px; display: flex; align-items: center; font-size: 15px; color: #e8e7e2; border-bottom: 1px solid #2e2e2b;">Ayuda y preguntas frecuentes</a>
    <a href="#" style="min-height: 52px; display: flex; align-items: center; font-size: 15px; color: #e8e7e2; border-bottom: 1px solid #2e2e2b;">Privacidad y datos</a>
    <a href="A-Login.dc.html" style="min-height: 52px; display: flex; align-items: center; font-size: 15px; color: #d98080;">Cerrar sesión</a>
  </section>

  <div style="text-align: center; font-size: 10px; letter-spacing: 0.3em; color: #6a6a64;">ViTAH · VERSIÓN 1.0.0</div>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; display: flex; background: #181817; border-top: 1px solid #2e2e2b;">
    <a href="A-Home.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="A-Progress.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Obra</a>
    <a href="A-Gallery.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-9 8"></path></svg>Fotos</a>
    <a href="A-Documents.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>Documentos</a>
    <a href="A-Settings.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #e8e7e2; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'es', face: true, n: { obra: true, docs: true, msgs: false } };
  }
  renderVals() {
    const s = this.state;
    const langs = [{ id: 'es', label: 'Español' }, { id: 'en', label: 'English' }];
    const notifs = [
      { id: 'obra', label: 'Avances de obra', hint: 'Nuevas fotos y fases completadas' },
      { id: 'docs', label: 'Nuevos documentos', hint: 'Facturas, planos y certificados' },
      { id: 'msgs', label: 'Mensajes del equipo', hint: 'Respuestas del jefe de obra' },
    ];
    return {
      langs: langs.map((l) => ({ ...l, on: s.lang === l.id, off: s.lang !== l.id, pick: () => this.setState({ lang: l.id }) })),
      faceOn: s.face,
      faceOff: !s.face,
      toggleFace: () => this.setState({ face: !s.face }),
      notifs: notifs.map((n) => ({
        ...n,
        on: s.n[n.id],
        off: !s.n[n.id],
        toggle: () => this.setState({ n: { ...s.n, [n.id]: !s.n[n.id] } }),
      })),
    };
  }
}
</script>
</body>
</html>
