<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis viviendas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141413}
a{color:#8a9b62;text-decoration:none}a:hover{color:#a3b37a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #1e1e1e; font-family: 'Geist', system-ui, sans-serif; color: #e8e7e2; overflow: hidden;">

  <div aria-hidden="true" style="position: absolute; inset: 0; box-sizing: border-box; padding: 56px 24px 0; display: flex; flex-direction: column; gap: 28px;">
    <div style="min-height: 44px; display: flex; align-items: center; font-size: 16px; letter-spacing: 0.4em;">ViTAH</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: #9a9a94;">BUENAS TARDES</div>
      <div style="font-size: 30px; font-weight: 300; line-height: 1.15;">Elena, tu casa avanza.</div>
    </div>
    <div style="height: 360px; background: #262624; border: 1px solid #34342f; border-radius: 16px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: #8a9b62;">VTH-26-001</div>
      <div style="font-size: 72px; font-weight: 200; line-height: 0.9;">62<span style="font-size: 28px; color: #9a9a94;">%</span></div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10, 10, 9, 0.62);"></div>

  <section role="dialog" aria-label="Mis viviendas" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 24px 42px; background: #262624; border-top: 1px solid #34342f; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 18px;">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #4a4a45;"></span>

    <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h2 style="margin: 0; font-size: 22px; font-weight: 300;">Mis viviendas</h2>
        <div style="font-size: 13px; color: #9a9a94;">Elige la vivienda que ves en la app.</div>
      </div>
      <a href="A-Home-Viviendas.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; margin: -6px -10px 0 0; display: flex; align-items: center; justify-content: center; color: #9a9a94;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </header>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{homes}}" as="h" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{h.pressed}}" onClick="{{h.pick}}" style="{{h.rowStyle}}">
          <sc-if value="{{h.on}}" hint-placeholder-val="{{false}}">
            <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #8a9b62; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8a9b62;"></span></span>
          </sc-if>
          <sc-if value="{{h.off}}" hint-placeholder-val="{{true}}">
            <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #4a4a45; flex-shrink: 0;"></span>
          </sc-if>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: left;">
            <span style="{{h.refStyle}}">{{h.ref}}</span>
            <span style="font-size: 15px; color: #e8e7e2;">{{h.address}}</span>
            <span style="font-size: 13px; color: #9a9a94;">{{h.status}}</span>
            <sc-if value="{{h.building}}" hint-placeholder-val="{{true}}">
              <span style="margin-top: 4px; height: 2px; border-radius: 1px; background: #3c3c37; overflow: hidden; display: block;"><span style="display: block; width: 62%; height: 2px; background: #8a9b62;"></span></span>
            </sc-if>
          </span>
          <span style="font-size: 15px; color: #8a9b62; align-self: flex-start; padding-top: 18px;">{{h.pct}}</span>
        </button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'VTH-26-001' };
  }
  renderVals() {
    const homes = [
      { ref: 'VTH-26-001', address: 'Calle Castelar 12, Santander', status: 'En obra · entrega 15 ene 2027', pct: '62 %', building: true },
      { ref: 'VTH-24-007', address: 'Barrio La Sierra 4, Liencres', status: 'Entregada · jun 2025 · en garantía', pct: '', building: false },
    ];
    const row = 'width: 100%; min-height: 84px; box-sizing: border-box; padding: 14px 16px; border-radius: 12px; display: flex; align-items: flex-start; gap: 14px; cursor: pointer; background: #1e1e1e; border: 1px solid ';
    return {
      homes: homes.map((h) => {
        const on = this.state.picked === h.ref;
        return {
          ...h,
          on,
          off: !on,
          pressed: on ? 'true' : 'false',
          rowStyle: row + (on ? '#6b7a4a;' : '#34342f;'),
          refStyle: 'font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: ' + (on ? '#8a9b62' : '#9a9a94') + ';',
          pick: () => this.setState({ picked: h.ref }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
