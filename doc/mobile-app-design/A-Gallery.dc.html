<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ViTAH · Fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141413;font-family:'Geist',system-ui,sans-serif;color:#e8e7e2}
a{color:#8a9b62;text-decoration:none}a:hover{color:#a3b37a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; box-sizing: border-box; background: #1e1e1e; padding: 56px 0 110px; display: flex; flex-direction: column; gap: 24px; font-family: 'Geist', system-ui, sans-serif; color: #e8e7e2; overflow: hidden;">

  <header style="padding: 0 24px; display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: #9a9a94;">86 FOTOS · 14 VISITAS</div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 300;">Fotografías</h1>
    </div>
    <button type="button" aria-label="Vista en cuadrícula" style="width: 44px; height: 44px; background: none; border: 1px solid #34342f; border-radius: 10px; color: #e8e7e2; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>
    </button>
  </header>

  <div style="padding: 0 24px; display: flex; gap: 8px; overflow: hidden;">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
      <sc-if value="{{chip.on}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-pressed="true" onClick="{{chip.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; cursor: pointer; background: #e8e7e2; color: #1e1e1e; border: 1px solid #e8e7e2;">{{chip.label}}</button>
      </sc-if>
      <sc-if value="{{chip.off}}" hint-placeholder-val="{{true}}">
        <button type="button" aria-pressed="false" onClick="{{chip.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; cursor: pointer; background: transparent; color: #e8e7e2; border: 1px solid #3c3c37;">{{chip.label}}</button>
      </sc-if>
    </sc-for>
  </div>

  <section style="padding: 0 24px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 400;">Semana 38 · Cubierta</h2>
      <span style="font-size: 13px; color: #9a9a94;">22 sep</span>
    </div>
    <div style="height: 220px; border-radius: 14px; overflow: hidden; background: #2c2f27; position: relative;">
      <svg width="342" height="220" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#6b7a4a" stroke-width="0.6"><path d="M0 86h160"></path><path d="M30 86V50l40-26 40 26v36"></path><path d="M24 54l46-30 46 30"></path><path d="M44 86V64h14v22M78 58h20v12H78z"></path><path d="M110 60h26v26"></path></svg>
      <div style="position: absolute; left: 14px; bottom: 12px; font-size: 12px; letter-spacing: 0.08em; color: #e8e7e2; background: rgba(20,20,19,0.72); padding: 6px 10px; border-radius: 999px;">Fachada sur</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 104px; border-radius: 10px; background: #2a2d2e;"><svg width="100%" height="104" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#56666d" stroke-width="0.6"><path d="M0 44l30-18 30 18M10 60V38M50 60V38M20 60h20"></path></svg></div>
      <div style="height: 104px; border-radius: 10px; background: #33312b;"><svg width="100%" height="104" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#7a705c" stroke-width="0.6"><path d="M8 8h44v44H8zM8 30h44M30 8v44"></path></svg></div>
      <div style="height: 104px; border-radius: 10px; background: #2c2f27; position: relative;"><svg width="100%" height="104" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#6b7a4a" stroke-width="0.6"><path d="M0 50h60M12 50V24l18-12 18 12v26"></path></svg><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; background: rgba(20,20,19,0.55); border-radius: 10px;">+9</span></div>
    </div>
  </section>

  <section style="padding: 0 24px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 400;">Semana 36 · Aislamiento</h2>
      <span style="font-size: 13px; color: #9a9a94;">8 sep</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 150px; border-radius: 10px; background: #33312b;"><svg width="100%" height="150" viewBox="0 0 80 80" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#7a705c" stroke-width="0.6"><path d="M10 10h60v60H10zM10 25h60M10 40h60M10 55h60M30 10v60M50 10v60"></path></svg></div>
      <div style="display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px;">
        <div style="border-radius: 10px; background: #2a2d2e;"></div>
        <div style="border-radius: 10px; background: #2c2f27;"></div>
      </div>
    </div>
  </section>

  <section style="padding: 0 24px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 400;">Semana 24 · Estructura LSF</h2>
      <span style="font-size: 13px; color: #9a9a94;">15 jun</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 104px; border-radius: 10px; background: #2c2f27;"><svg width="100%" height="104" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#6b7a4a" stroke-width="0.6"><path d="M6 56V30l24-16 24 16v26M14 56V25M22 56V19M30 56V14M38 56V19M46 56V25"></path></svg></div>
      <div style="height: 104px; border-radius: 10px; background: #2a2d2e;"></div>
      <div style="height: 104px; border-radius: 10px; background: #33312b;"></div>
    </div>
  </section>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; display: flex; background: #181817; border-top: 1px solid #2e2e2b;">
    <a href="A-Home.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="A-Progress.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Obra</a>
    <a href="A-Gallery.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #e8e7e2; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-9 8"></path></svg>Fotos</a>
    <a href="A-Documents.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>Documentos</a>
    <a href="A-Settings.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #8a8a84; font-size: 10px; letter-spacing: 0.08em;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'Todas' }; }
  renderVals() {
    const labels = ['Todas', 'Estructura', 'Cubierta', 'Fachada', 'Interior'];
    return {
      chips: labels.map((label) => ({
        label,
        on: this.state.picked === label,
        off: this.state.picked !== label,
        pick: () => this.setState({ picked: label }),
      })),
    };
  }
}
</script>
</body>
</html>
