<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ViTAH · Garantía</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141413;font-family:'Geist',system-ui,sans-serif;color:#e8e7e2}
a{color:#8a9b62;text-decoration:none}a:hover{color:#a3b37a}
input,button,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; box-sizing: border-box; background: #1e1e1e; padding: 48px 24px 120px; display: flex; flex-direction: column; gap: 24px; font-family: 'Geist', system-ui, sans-serif; color: #e8e7e2; overflow: hidden;">

  <header style="display: flex; align-items: center; justify-content: space-between; margin-left: -12px;">
    <a href="A-Home.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #e8e7e2;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 14px;">Mis solicitudes (1)</a>
  </header>

  <section style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 30px; font-weight: 300;">Solicitud de garantía</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #9a9a94;">Cuéntanos qué ocurre. Tu jefe de obra te responderá en menos de 48 horas.</p>
  </section>

  <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="border: 1px solid #34342f; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 22px; font-weight: 300;">1 año</span><span style="font-size: 12px; color: #9a9a94;">Acabados</span></div>
    <div style="border: 1px solid #34342f; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 22px; font-weight: 300;">3 años</span><span style="font-size: 12px; color: #9a9a94;">Instalaciones</span></div>
    <div style="border: 1px solid #34342f; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 22px; font-weight: 300;">10 años</span><span style="font-size: 12px; color: #9a9a94;">Estructura</span></div>
  </section>

  <form style="display: flex; flex-direction: column; gap: 22px;">
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; color: #9a9a94;">TIPO DE INCIDENCIA</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="5">
          <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; cursor: pointer; background: #4a5e2c; color: #f5f4f0; border: 1px solid #6b7a4a;">{{t.label}}</button>
          </sc-if>
          <sc-if value="{{t.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; cursor: pointer; background: transparent; color: #e8e7e2; border: 1px solid #3c3c37;">{{t.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; color: #9a9a94;">ESTANCIA
      <span style="position: relative; display: flex;">
        <select style="flex-grow: 1; appearance: none; height: 52px; padding: 0 16px; background: #262624; border: 1px solid #34342f; border-radius: 8px; color: #e8e7e2; font-size: 16px; letter-spacing: 0;">
          <option>Baño principal</option><option>Cocina</option><option>Salón</option><option>Dormitorio 1</option><option>Exterior</option>
        </select>
        <svg style="position: absolute; right: 14px; top: 16px;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9a94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; color: #9a9a94;">DESCRIPCIÓN
      <textarea rows="4" style="padding: 14px 16px; background: #262624; border: 1px solid #34342f; border-radius: 8px; color: #e8e7e2; font-size: 16px; line-height: 1.45; letter-spacing: 0; resize: none;">El grifo del lavabo gotea de forma continua aunque esté cerrado.</textarea>
    </label>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.22em; color: #9a9a94;">FOTOGRAFÍAS</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <button type="button" aria-label="Añadir foto" style="aspect-ratio: 1; box-sizing: border-box; border: 1px dashed #4a4a45; border-radius: 10px; background: none; color: #8a9b62; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l2-3h4l2 3h4v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
        <div style="aspect-ratio: 1; border-radius: 10px; background: #2a2d2e;"></div>
        <div style="aspect-ratio: 1; border-radius: 10px; background: #33312b;"></div>
      </div>
    </div>

    <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; border-top: 1px solid #2e2e2b; padding-top: 14px;">
      <span style="display: flex; flex-direction: column; gap: 2px;">Es urgente<span style="font-size: 13px; color: #9a9a94;">Fugas de agua, electricidad o seguridad</span></span>
      <input type="checkbox" style="width: 22px; height: 22px; accent-color: #6b7a4a;">
    </label>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 16px 24px 30px; background: #181817; border-top: 1px solid #2e2e2b;">
    <button type="submit" style="width: 100%; height: 54px; background: #4a5e2c; border: none; border-radius: 8px; color: #f5f4f0; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; cursor: pointer;">ENVIAR SOLICITUD</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'Fontanería' }; }
  renderVals() {
    const labels = ['Acabados', 'Fontanería', 'Electricidad', 'Carpintería', 'Humedades', 'Otro'];
    return {
      types: labels.map((label) => ({
        label,
        on: this.state.picked === label,
        off: this.state.picked !== label,
        pick: () => this.setState({ picked: label }),
      })),
    };
  }
}
</script>
</body>
</html>
